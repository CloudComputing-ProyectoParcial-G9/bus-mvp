# MS-Analytics OpenAPI Specification

openapi: 3.0.3
info:
  title: Bus MVP Analytics API
  description: |
    Microservicio de analítica que consume datos de AWS Athena para generar
    insights de negocio sobre pasajeros, viajes, tickets e ingresos.
    
    ## Arquitectura
    - **Backend**: FastAPI + Python 3.11
    - **Data Source**: AWS Athena
    - **Storage**: AWS S3 (bus-mvp-datalake-1)
    - **Catalog**: AWS Glue Database
    
    ## Endpoints Principales
    - `/api/v1/analytics/summary` - Dashboard ejecutivo
    - `/api/v1/analytics/passengers` - Análisis de pasajeros
    - `/api/v1/analytics/revenue` - Análisis de ingresos
    - `/api/v1/analytics/occupancy` - Análisis de ocupación
    - `/api/v1/analytics/trips` - Análisis de viajes
    
  version: 1.0.0
  contact:
    name: Bus MVP Team
    url: https://github.com/yourusername/bus-mvp
  license:
    name: MIT

servers:
  - url: http://localhost:8005
    description: Desarrollo local
  - url: http://localhost:8005/api/v1
    description: API v1

tags:
  - name: Health
    description: Health check endpoints
  - name: Analytics
    description: Analytics endpoints

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health Check
      description: Verifica el estado del servicio y la conexión con Athena
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /analytics/summary:
    get:
      tags:
        - Analytics
      summary: Dashboard Summary
      description: Resumen ejecutivo con métricas principales
      responses:
        '200':
          description: Resumen exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponse'

  /analytics/passengers:
    get:
      tags:
        - Analytics
      summary: Passenger Analytics
      description: Análisis de pasajeros con segmentación
      responses:
        '200':
          description: Analytics de pasajeros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassengerAnalyticsResponse'

  /analytics/revenue:
    get:
      tags:
        - Analytics
      summary: Revenue Analytics
      description: Análisis de ingresos por ruta
      responses:
        '200':
          description: Analytics de ingresos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueAnalyticsResponse'

  /analytics/occupancy:
    get:
      tags:
        - Analytics
      summary: Occupancy Analytics
      description: Análisis de ocupación de buses
      responses:
        '200':
          description: Analytics de ocupación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupancyAnalyticsResponse'

  /analytics/trips:
    get:
      tags:
        - Analytics
      summary: Trip Analytics
      description: Análisis de viajes por estado
      responses:
        '200':
          description: Analytics de viajes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripAnalyticsResponse'

components:
  schemas:
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: ms-analytics
        version:
          type: string
          example: 1.0.0
        timestamp:
          type: string
          format: date-time
        athena_connection:
          type: boolean

    DashboardSummaryResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/SummaryMetrics'
        trends:
          $ref: '#/components/schemas/SummaryTrends'

    SummaryMetrics:
      type: object
      properties:
        total_passengers:
          type: integer
        active_trips:
          type: integer
        tickets_sold:
          type: integer
        total_revenue:
          type: number
        average_occupancy:
          type: number
        cancellation_rate:
          type: number

    SummaryTrends:
      type: object
      properties:
        revenue_growth:
          type: number
        passenger_growth:
          type: number

    PassengerAnalyticsResponse:
      type: object
      properties:
        total_passengers:
          type: integer
        active_passengers:
          type: integer
        passenger_segments:
          type: object
          additionalProperties:
            type: integer
        top_customers:
          type: array
          items:
            $ref: '#/components/schemas/TopCustomer'

    TopCustomer:
      type: object
      properties:
        passenger_id:
          type: string
        full_name:
          type: string
        total_spent:
          type: number
        tickets_purchased:
          type: integer
        segment:
          type: string

    RevenueAnalyticsResponse:
      type: object
      properties:
        total_revenue:
          type: number
        confirmed_revenue:
          type: number
        cancelled_revenue:
          type: number
        by_route:
          type: array
          items:
            $ref: '#/components/schemas/RouteRevenue'

    RouteRevenue:
      type: object
      properties:
        route_id:
          type: string
        total_revenue:
          type: number
        trips_count:
          type: integer
        avg_revenue_per_trip:
          type: number

    OccupancyAnalyticsResponse:
      type: object
      properties:
        average_occupancy:
          type: number
        total_capacity:
          type: integer
        total_seats_sold:
          type: integer
        by_level:
          type: object
          additionalProperties:
            type: integer
        by_route:
          type: array
          items:
            $ref: '#/components/schemas/OccupancyByRoute'

    OccupancyByRoute:
      type: object
      properties:
        route_id:
          type: string
        avg_occupancy:
          type: number
        trips_count:
          type: integer

    TripAnalyticsResponse:
      type: object
      properties:
        total_trips:
          type: integer
        active_trips:
          type: integer
        completed_trips:
          type: integer
        cancelled_trips:
          type: integer
        occupancy_breakdown:
          type: object
          additionalProperties:
            type: integer
