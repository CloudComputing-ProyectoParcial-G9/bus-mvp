openapi: 3.0.3
info:
  title: Trips Microservice API
  description: |
    Microservicio para gestión de viajes y rutas del sistema Bus MVP.
    Maneja la creación, actualización y consulta de viajes, rutas y horarios.
    
    **Base de datos**: SQL DB 2 (motor a definir)
    **Puerto**: 8002
  version: 1.0.0
  contact:
    name: Backend Team 2 (@B2)
    email: backend2@busmvp.com

servers:
  - url: http://localhost:8002
    description: Servidor de desarrollo local
  - url: http://localhost:8088/api/trips
    description: A través del Load Balancer

paths:
  /health:
    get:
      summary: Health Check
      description: Endpoint para verificar el estado del servicio
      tags:
        - Health
      responses:
        '200':
          description: Servicio funcionando correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-15T10:30:00Z"
                  version:
                    type: string
                    example: "1.0.0"
                  database:
                    type: string
                    example: "connected"

  /trips:
    get:
      summary: Listar viajes
      description: Obtiene una lista paginada de viajes disponibles
      tags:
        - Trips
      parameters:
        - name: page
          in: query
          description: Número de página (empezando en 1)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Número de elementos por página
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: origin
          in: query
          description: Ciudad de origen
          required: false
          schema:
            type: string
        - name: destination
          in: query
          description: Ciudad de destino
          required: false
          schema:
            type: string
        - name: date
          in: query
          description: Fecha de viaje (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: status
          in: query
          description: Estado del viaje
          required: false
          schema:
            type: string
            enum: [scheduled, in_progress, completed, cancelled]
      responses:
        '200':
          description: Lista de viajes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trip'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      summary: Crear nuevo viaje
      description: Programa un nuevo viaje en el sistema
      tags:
        - Trips
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Viaje creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Trip created successfully"
                  data:
                    $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /trips/{id}:
    get:
      summary: Obtener viaje por ID
      description: Retorna la información detallada de un viaje específico
      tags:
        - Trips
      parameters:
        - name: id
          in: path
          required: true
          description: ID único del viaje
          schema:
            type: string
      responses:
        '200':
          description: Información del viaje
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Trip'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      summary: Actualizar viaje
      description: Actualiza la información de un viaje existente
      tags:
        - Trips
      parameters:
        - name: id
          in: path
          required: true
          description: ID único del viaje
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripRequest'
      responses:
        '200':
          description: Viaje actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Trip updated successfully"
                  data:
                    $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /routes:
    get:
      summary: Listar rutas disponibles
      description: Obtiene todas las rutas configuradas en el sistema
      tags:
        - Routes
      responses:
        '200':
          description: Lista de rutas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Route'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      summary: Crear nueva ruta
      description: Registra una nueva ruta en el sistema
      tags:
        - Routes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouteRequest'
      responses:
        '201':
          description: Ruta creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Route created successfully"
                  data:
                    $ref: '#/components/schemas/Route'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Conflicto - Ruta ya existe
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Route with this code already exists"
                  code:
                    type: string
                    example: "DUPLICATE_ROUTE"
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    Trip:
      type: object
      properties:
        trip_id:
          type: string
          description: Identificador único del viaje
          example: "trip_001"
        route_code:
          type: string
          description: Código de la ruta
          example: "RT001"
        origin_city:
          type: string
          description: Ciudad de origen
          example: "Madrid"
        destination_city:
          type: string
          description: Ciudad de destino
          example: "Barcelona"
        departure_time:
          type: string
          format: date-time
          description: Hora de salida
          example: "2024-01-20T08:00:00Z"
        arrival_time:
          type: string
          format: date-time
          description: Hora de llegada
          example: "2024-01-20T14:30:00Z"
        bus_capacity:
          type: integer
          description: Capacidad total del autobús
          example: 50
        available_seats:
          type: integer
          description: Asientos disponibles
          example: 35
        base_price:
          type: number
          format: decimal
          description: Precio base del viaje
          example: 45.50
        currency:
          type: string
          description: Moneda del precio
          example: "EUR"
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled]
          description: Estado actual del viaje
          example: "scheduled"
        created_at:
          type: string
          format: date-time
          description: Fecha de creación
          example: "2024-01-15T10:30:00Z"

    Route:
      type: object
      properties:
        route_code:
          type: string
          description: Código único de la ruta
          example: "RT001"
        name:
          type: string
          description: Nombre descriptivo de la ruta
          example: "Madrid - Barcelona Express"
        origin_city:
          type: string
          description: Ciudad de origen
          example: "Madrid"
        destination_city:
          type: string
          description: Ciudad de destino
          example: "Barcelona"
        distance_km:
          type: number
          description: Distancia en kilómetros
          example: 621.5
        estimated_duration:
          type: string
          description: Duración estimada (HH:MM)
          example: "06:30"
        active:
          type: boolean
          description: Si la ruta está activa
          example: true

    CreateTripRequest:
      type: object
      required:
        - route_code
        - departure_time
        - arrival_time
        - bus_capacity
        - base_price
      properties:
        route_code:
          type: string
          example: "RT001"
        departure_time:
          type: string
          format: date-time
          example: "2024-01-20T08:00:00Z"
        arrival_time:
          type: string
          format: date-time
          example: "2024-01-20T14:30:00Z"
        bus_capacity:
          type: integer
          minimum: 10
          maximum: 100
          example: 50
        base_price:
          type: number
          format: decimal
          minimum: 0
          example: 45.50
        currency:
          type: string
          default: "EUR"
          example: "EUR"

    UpdateTripRequest:
      type: object
      properties:
        departure_time:
          type: string
          format: date-time
          example: "2024-01-20T08:30:00Z"
        arrival_time:
          type: string
          format: date-time
          example: "2024-01-20T15:00:00Z"
        available_seats:
          type: integer
          minimum: 0
          example: 30
        base_price:
          type: number
          format: decimal
          minimum: 0
          example: 50.00
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled]
          example: "in_progress"

    CreateRouteRequest:
      type: object
      required:
        - route_code
        - name
        - origin_city
        - destination_city
        - distance_km
        - estimated_duration
      properties:
        route_code:
          type: string
          pattern: '^RT[0-9]{3}$'
          example: "RT001"
        name:
          type: string
          minLength: 5
          maxLength: 100
          example: "Madrid - Barcelona Express"
        origin_city:
          type: string
          minLength: 2
          maxLength: 50
          example: "Madrid"
        destination_city:
          type: string
          minLength: 2
          maxLength: 50
          example: "Barcelona"
        distance_km:
          type: number
          minimum: 1
          example: 621.5
        estimated_duration:
          type: string
          pattern: '^[0-9]{2}:[0-9]{2}$'
          example: "06:30"

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        pages:
          type: integer
          example: 8

    Error:
      type: object
      properties:
        error:
          type: string
          description: Mensaje de error
        code:
          type: string
          description: Código de error
        timestamp:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Solicitud incorrecta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Invalid request parameters"
            code: "BAD_REQUEST"
            timestamp: "2024-01-15T10:30:00Z"

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Trip not found"
            code: "NOT_FOUND"
            timestamp: "2024-01-15T10:30:00Z"

    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Internal server error"
            code: "INTERNAL_ERROR"
            timestamp: "2024-01-15T10:30:00Z"

tags:
  - name: Health
    description: Endpoints de salud del servicio
  - name: Trips
    description: Operaciones relacionadas con viajes
  - name: Routes
    description: Operaciones relacionadas con rutas
