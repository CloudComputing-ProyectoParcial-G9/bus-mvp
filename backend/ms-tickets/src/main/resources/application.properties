server.port=${MS_TICKETS_PORT:8003}


# MongoDB configuration (used by ms-tickets after migration)
# If SPRING_DATA_MONGODB_URI is provided in the environment, it will be used; otherwise
# default to connecting to a mongo service named `nosql-db` on the Docker network.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://nosql-db:27017/tickets_db}

# Deprecated/removed Redis defaults to avoid accidental localhost fallback inside container
#spring.redis.host=${SPRING_REDIS_HOST:localhost}
#spring.redis.port=${SPRING_REDIS_PORT:6379}

app.idempotency.ttl=${IDEMPOTENCY_TTL_SECONDS:3600}
