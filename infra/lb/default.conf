# ===================================
# Load Balancer Configuration
# ===================================
#
# Configuración genérica para Load Balancer (Nginx)
# TODO: Adaptar según necesidades específicas

# Configuración de upstream servers
upstream ms_passengers {
    server ms-passengers:${MS_PASSENGERS_PORT};
    # TODO: Añadir más instancias para HA
    # server ms-passengers-2:${MS_PASSENGERS_PORT} backup;
}

upstream ms_trips {
    server ms-trips:${MS_TRIPS_PORT};
    # TODO: Añadir más instancias para HA
    # server ms-trips-2:${MS_TRIPS_PORT} backup;
}

upstream ms_tickets {
    server ms-tickets:${MS_TICKETS_PORT};
    # TODO: Añadir más instancias para HA
    # server ms-tickets-2:${MS_TICKETS_PORT} backup;
}

upstream ms_history {
    server ms-history:${MS_HISTORY_PORT};
    # TODO: Añadir más instancias para HA
    # server ms-history-2:${MS_HISTORY_PORT} backup;
}

upstream ms_analytics {
    server ms-analytics:${MS_ANALYTICS_PORT};
    # TODO: Añadir más instancias para HA
    # server ms-analytics-2:${MS_ANALYTICS_PORT} backup;
}

# Configuración del servidor principal
server {
    listen ${LB_PORT};
    server_name localhost;

    # Configuración general
    client_max_body_size 10M;
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Headers comunes para proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ===================================
    # RUTAS DE MICROSERVICIOS
    # ===================================

    # Microservicio de Pasajeros
    location /api/passengers {
        rewrite ^/api/passengers(.*) $1 break;
        proxy_pass http://ms_passengers;
        
        # Headers específicos
        proxy_set_header X-Service "ms-passengers";
        
        # Timeouts específicos
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Microservicio de Viajes
    location /api/trips {
        rewrite ^/api/trips(.*) $1 break;
        proxy_pass http://ms_trips;
        
        # Headers específicos
        proxy_set_header X-Service "ms-trips";
        
        # Timeouts específicos
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Microservicio de Boletos
    location /api/tickets {
        rewrite ^/api/tickets(.*) $1 break;
        proxy_pass http://ms_tickets;
        
        # Headers específicos
        proxy_set_header X-Service "ms-tickets";
        
        # Timeouts específicos
        proxy_connect_timeout 15s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Microservicio de Historial (Agregador)
    location /api/history {
        rewrite ^/api/history(.*) $1 break;
        proxy_pass http://ms_history;
        
        # Headers específicos
        proxy_set_header X-Service "ms-history";
        
        # Timeouts más largos para agregación
        proxy_connect_timeout 20s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
    }

    # Microservicio Analítico
    location /api/analytics {
        rewrite ^/api/analytics(.*) $1 break;
        proxy_pass http://ms_analytics;
        
        # Headers específicos
        proxy_set_header X-Service "ms-analytics";
        
        # Timeouts largos para consultas analíticas
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ===================================
    # RUTAS ESPECIALES
    # ===================================

    # Health check agregado
    location /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","timestamp":"$time_iso8601","load_balancer":"nginx"}';
    }

    # Documentación OpenAPI agregada
    location /docs {
        add_header Content-Type text/html;
        return 200 '
        <!DOCTYPE html>
        <html>
        <head><title>Bus MVP - API Documentation</title></head>
        <body>
            <h1>Bus MVP - Microservices API Documentation</h1>
            <ul>
                <li><a href="/api/passengers/docs">Passengers API</a></li>
                <li><a href="/api/trips/docs">Trips API</a></li>
                <li><a href="/api/tickets/docs">Tickets API</a></li>
                <li><a href="/api/history/docs">History API</a></li>
                <li><a href="/api/analytics/docs">Analytics API</a></li>
            </ul>
        </body>
        </html>';
    }

    # ===================================
    # CONFIGURACIÓN CORS
    # ===================================

    # CORS para desarrollo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # CORS para APIs
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

    # ===================================
    # CONFIGURACIÓN DE ERRORES
    # ===================================

    # Páginas de error personalizadas
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        add_header Content-Type application/json;
        return 404 '{"error":"Endpoint not found","code":"NOT_FOUND","timestamp":"$time_iso8601"}';
    }

    location = /50x.html {
        add_header Content-Type application/json;
        return 500 '{"error":"Internal server error","code":"INTERNAL_ERROR","timestamp":"$time_iso8601"}';
    }

    # ===================================
    # LOGGING
    # ===================================

    # Formato de log personalizado
    log_format bus_mvp '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log bus_mvp;
    error_log /var/log/nginx/error.log warn;
}

