# ========================================
# Docker Compose - Bus MVP
# ========================================
#
# Orquestación completa del sistema Bus MVP
# Incluye: 5 microservicios + bases de datos + load balancer
#
# Uso:
# 1. Copiar .env.example a .env y configurar
# 2. docker-compose up -d --build
#
# TODO: Elegir motores específicos de DB y completar configuración

version: '3.8'

# ========================================
# REDES
# ========================================
networks:
  bus-mvp-network:
    driver: bridge
    name: bus-mvp-network

# ========================================
# VOLÚMENES
# ========================================
volumes:
  # Volúmenes para persistencia de bases de datos
  sql1_data:
    name: bus_mvp_sql1_data
  sql2_data:
    name: bus_mvp_sql2_data
  nosql_data:
    name: bus_mvp_nosql_data
  
  # Volúmenes para logs
  nginx_logs:
    name: bus_mvp_nginx_logs

# ========================================
# SERVICIOS
# ========================================
services:

  # ========================================
  # BASES DE DATOS
  # ========================================

  # SQL Database 1 (para ms-passengers)
  # TODO: Elegir motor específico y descomentar
  sql-db1:
    # Opción PostgreSQL:
    image: postgres:15-alpine
    container_name: bus-mvp-sql-db1
    environment:
      POSTGRES_DB: ${SQL1_DB}
      POSTGRES_USER: ${SQL1_USER}
      POSTGRES_PASSWORD: ${SQL1_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${SQL1_PORT}:5432"
    
    # Opción MySQL:
    # image: mysql:8.0
    # container_name: bus-mvp-sql-db1
    # environment:
    #   MYSQL_ROOT_PASSWORD: ${SQL1_PASSWORD}
    #   MYSQL_DATABASE: ${SQL1_DB}
    #   MYSQL_USER: ${SQL1_USER}
    #   MYSQL_PASSWORD: ${SQL1_PASSWORD}
    # ports:
    #   - "${SQL1_PORT}:3306"
    
    # Opción SQL Server:
    # image: mcr.microsoft.com/mssql/server:2022-latest
    # container_name: bus-mvp-sql-db1
    # environment:
    #   SA_PASSWORD: ${SQL1_PASSWORD}
    #   ACCEPT_EULA: Y
    #   MSSQL_DB: ${SQL1_DB}
    # ports:
    #   - "${SQL1_PORT}:1433"
    
    volumes:
      - sql1_data:/var/lib/postgresql/data
      # MySQL: - sql1_data:/var/lib/mysql
      # SQL Server: - sql1_data:/var/opt/mssql
    networks:
      - bus-mvp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL1_USER} -d ${SQL1_DB}"]
      # MySQL: test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${SQL1_USER}", "-p${SQL1_PASSWORD}"]
      # SQL Server: test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P ${SQL1_PASSWORD} -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SQL Database 2 (para ms-trips)
  # TODO: Elegir motor diferente al anterior
  sql-db2:
    # Opción MySQL (si SQL1 es PostgreSQL):
    image: mysql:8.0
    container_name: bus-mvp-sql-db2
    environment:
      MYSQL_ROOT_PASSWORD: ${SQL2_PASSWORD}
      MYSQL_DATABASE: ${SQL2_DB}
      MYSQL_USER: ${SQL2_USER}
      MYSQL_PASSWORD: ${SQL2_PASSWORD}
    ports:
      - "${SQL2_PORT}:3306"
    
    # Opción PostgreSQL (si SQL1 es MySQL):
    # image: postgres:15-alpine
    # container_name: bus-mvp-sql-db2
    # environment:
    #   POSTGRES_DB: ${SQL2_DB}
    #   POSTGRES_USER: ${SQL2_USER}
    #   POSTGRES_PASSWORD: ${SQL2_PASSWORD}
    # ports:
    #   - "${SQL2_PORT}:5432"
    
    volumes:
      - sql2_data:/var/lib/mysql
      # PostgreSQL: - sql2_data:/var/lib/postgresql/data
    networks:
      - bus-mvp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${SQL2_USER}", "-p${SQL2_PASSWORD}"]
      # PostgreSQL: test: ["CMD-SHELL", "pg_isready -U ${SQL2_USER} -d ${SQL2_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NoSQL Database (para ms-tickets)
  # TODO: Elegir motor NoSQL específico
  nosql-db:
    # Opción MongoDB:
    image: mongo:7.0
    container_name: bus-mvp-nosql-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${NOSQL_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${NOSQL_PASSWORD}
      MONGO_INITDB_DATABASE: ${NOSQL_DB}
    ports:
      - "27017:27017"
    
    # Opción CouchDB:
    # image: couchdb:3.3
    # container_name: bus-mvp-nosql-db
    # environment:
    #   COUCHDB_USER: ${NOSQL_USER}
    #   COUCHDB_PASSWORD: ${NOSQL_PASSWORD}
    # ports:
    #   - "5984:5984"
    
    # Opción Redis:
    # image: redis:7-alpine
    # container_name: bus-mvp-nosql-db
    # command: redis-server --requirepass ${NOSQL_PASSWORD}
    # ports:
    #   - "6379:6379"
    
    volumes:
      - nosql_data:/data/db
      # CouchDB: - nosql_data:/opt/couchdb/data
      # Redis: - nosql_data:/data
    networks:
      - bus-mvp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      # CouchDB: test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      # Redis: test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # MICROSERVICIOS
  # ========================================

  # Microservicio de Pasajeros
  ms-passengers:
    build:
      context: ../backend/ms-passengers
      dockerfile: Dockerfile
    container_name: bus-mvp-ms-passengers
    environment:
      - SQL1_HOST=sql-db1
      - SQL1_PORT=5432  # Ajustar según motor elegido
      - SQL1_DB=${SQL1_DB}
      - SQL1_USER=${SQL1_USER}
      - SQL1_PASSWORD=${SQL1_PASSWORD}
      - MS_PASSENGERS_PORT=${MS_PASSENGERS_PORT}
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${MS_PASSENGERS_PORT}:${MS_PASSENGERS_PORT}"
    depends_on:
      sql-db1:
        condition: service_healthy
    networks:
      - bus-mvp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MS_PASSENGERS_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Microservicio de Viajes
  ms-trips:
    build:
      context: ../backend/ms-trips
      dockerfile: Dockerfile
    container_name: bus-mvp-ms-trips
    environment:
      - SQL2_HOST=sql-db2
      - SQL2_PORT=3306  # Ajustar según motor elegido
      - SQL2_DB=${SQL2_DB}
      - SQL2_USER=${SQL2_USER}
      - SQL2_PASSWORD=${SQL2_PASSWORD}
      - MS_TRIPS_PORT=${MS_TRIPS_PORT}
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${MS_TRIPS_PORT}:${MS_TRIPS_PORT}"
    depends_on:
      sql-db2:
        condition: service_healthy
    networks:
      - bus-mvp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MS_TRIPS_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Microservicio de Boletos
  ms-tickets:
    build:
      context: ../backend/ms-tickets
      dockerfile: Dockerfile
    container_name: bus-mvp-ms-tickets
    environment:
      - NOSQL_URL=mongodb://${NOSQL_USER}:${NOSQL_PASSWORD}@nosql-db:27017/${NOSQL_DB}?authSource=admin
      - NOSQL_DB=${NOSQL_DB}
      - MS_TICKETS_PORT=${MS_TICKETS_PORT}
      - MS_TRIPS_URL=http://ms-trips:${MS_TRIPS_PORT}
      - MS_PASSENGERS_URL=http://ms-passengers:${MS_PASSENGERS_PORT}
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${MS_TICKETS_PORT}:${MS_TICKETS_PORT}"
    depends_on:
      nosql-db:
        condition: service_healthy
      ms-trips:
        condition: service_healthy
      ms-passengers:
        condition: service_healthy
    networks:
      - bus-mvp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MS_TICKETS_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Microservicio de Historial (Agregador)
  ms-history:
    build:
      context: ../backend/ms-history
      dockerfile: Dockerfile
    container_name: bus-mvp-ms-history
    environment:
      - MS_PASSENGERS_URL=http://ms-passengers:${MS_PASSENGERS_PORT}
      - MS_TRIPS_URL=http://ms-trips:${MS_TRIPS_PORT}
      - MS_TICKETS_URL=http://ms-tickets:${MS_TICKETS_PORT}
      - MS_HISTORY_PORT=${MS_HISTORY_PORT}
      - HTTP_TIMEOUT_MS=${HTTP_TIMEOUT_MS:-5000}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_DELAY_MS=${RETRY_DELAY_MS:-1000}
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${MS_HISTORY_PORT}:${MS_HISTORY_PORT}"
    depends_on:
      ms-passengers:
        condition: service_healthy
      ms-trips:
        condition: service_healthy
      ms-tickets:
        condition: service_healthy
    networks:
      - bus-mvp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MS_HISTORY_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Microservicio Analítico
  ms-analytics:
    build:
      context: ../backend/ms-analytics
      dockerfile: Dockerfile
    container_name: bus-mvp-ms-analytics
    environment:
      - MS_ANALYTICS_PORT=${MS_ANALYTICS_PORT}
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - CLOUD_REGION=${CLOUD_REGION}
      - OBJECT_STORE_BUCKET=${OBJECT_STORE_BUCKET}
      - QUERY_OUTPUT_PATH=${QUERY_OUTPUT_PATH}
      - CATALOG_DATABASE=${CATALOG_DATABASE}
      - QUERY_TIMEOUT_SECONDS=${QUERY_TIMEOUT_SECONDS:-300}
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Variables cloud (comentadas por defecto)
      # - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      # - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # - AWS_REGION=${AWS_REGION}
      # - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      # - AZURE_TENANT_ID=${AZURE_TENANT_ID}
    ports:
      - "${MS_ANALYTICS_PORT}:${MS_ANALYTICS_PORT}"
    networks:
      - bus-mvp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MS_ANALYTICS_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ========================================
  # LOAD BALANCER
  # ========================================

  load-balancer:
    image: nginx:1.25-alpine
    container_name: bus-mvp-load-balancer
    ports:
      - "${LB_PORT}:${LB_PORT}"
    volumes:
      - ./lb/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    environment:
      - MS_PASSENGERS_PORT=${MS_PASSENGERS_PORT}
      - MS_TRIPS_PORT=${MS_TRIPS_PORT}
      - MS_TICKETS_PORT=${MS_TICKETS_PORT}
      - MS_HISTORY_PORT=${MS_HISTORY_PORT}
      - MS_ANALYTICS_PORT=${MS_ANALYTICS_PORT}
      - LB_PORT=${LB_PORT}
    depends_on:
      ms-passengers:
        condition: service_healthy
      ms-trips:
        condition: service_healthy
      ms-tickets:
        condition: service_healthy
      ms-history:
        condition: service_healthy
      ms-analytics:
        condition: service_healthy
    networks:
      - bus-mvp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${LB_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # SERVICIOS OPCIONALES
  # ========================================

  # Redis para cache (opcional)
  # redis-cache:
  #   image: redis:7-alpine
  #   container_name: bus-mvp-redis-cache
  #   command: redis-server --requirepass ${REDIS_PASSWORD:-defaultpassword}
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - bus-mvp-network
  #   restart: unless-stopped

  # Monitoring con Prometheus (opcional)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: bus-mvp-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #   networks:
  #     - bus-mvp-network
  #   restart: unless-stopped

  # Grafana para dashboards (opcional)
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: bus-mvp-grafana
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   networks:
  #     - bus-mvp-network
  #   restart: unless-stopped

