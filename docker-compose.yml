version: "3.8"

services:
  # Base de datos MySQL para ms-trips
  mysql-trips:
    image: mysql:8.0
    container_name: mysql-trips
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: trips_db
      MYSQL_USER: trips_user
      MYSQL_PASSWORD: secure_password
    ports:
      - "3307:3306" # Puerto alternativo para evitar conflictos
    volumes:
      - mysql_trips_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Base de datos PostgreSQL para ms-passengers
  postgres-passengers:
    image: postgres:15
    container_name: postgres-passengers
    environment:
      POSTGRES_DB: passengers_db
      POSTGRES_USER: passengers_user
      POSTGRES_PASSWORD: passengers_password
    ports:
      - "5433:5432" # Puerto alternativo
    volumes:
      - postgres_passengers_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passengers_user -d passengers_db"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Base de datos MongoDB para ms-tickets
  mongo-tickets:
    image: mongo:7
    container_name: mongo-tickets
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: tickets_db
    ports:
      - "27018:27017" # Puerto alternativo
    volumes:
      - mongo_tickets_data:/data/db
      - ./backend/ms-tickets/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Microservicio ms-trips (Node.js)
  ms-trips:
    build:
      context: ./backend/ms-trips
      dockerfile: Dockerfile
    container_name: ms-trips
    ports:
      - "8002:8002"
    environment:
      - NODE_ENV=development
      - PORT=8002
      - MYSQL_HOST=mysql-trips
      - MYSQL_PORT=3306
      - MYSQL_DB=trips_db
      - MYSQL_USER=trips_user
      - MYSQL_PASSWORD=secure_password
      - DATABASE_URL=mysql://trips_user:secure_password@mysql-trips:3306/trips_db
      - CORS_ORIGIN=*
      - SWAGGER_ENABLED=true
    depends_on:
      mysql-trips:
        condition: service_healthy
    restart: unless-stopped

  # Microservicio ms-passengers (Python)
  ms-passengers:
    build:
      context: ./backend/ms-passengers
      dockerfile: Dockerfile
    container_name: ms-passengers
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://passengers_user:passengers_password@postgres-passengers:5432/passengers_db
      - ENVIRONMENT=development
    depends_on:
      postgres-passengers:
        condition: service_healthy
    restart: unless-stopped

  # Microservicio ms-tickets (Java)
  ms-tickets:
    build:
      context: ./backend/ms-tickets
      dockerfile: Dockerfile
    container_name: ms-tickets
    ports:
      - "8003:8003"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://tickets_user:tickets_password@mongo-tickets:27017/tickets_db
      - SPRING_PROFILES_ACTIVE=development
      - MS_TRIPS_URL=http://ms-trips:8002
      - MS_PASSENGERS_URL=http://ms-passengers:8001
    depends_on:
      mongo-tickets:
        condition: service_healthy
      ms-trips:
        condition: service_started
      ms-passengers:
        condition: service_started
    restart: unless-stopped

  # Microservicio ms-history (Go) - Agregador sin DB
  ms-history:
    build:
      context: ./backend/ms-history
      dockerfile: Dockerfile
    container_name: ms-history
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - ENVIRONMENT=development
      - MS_PASSENGERS_URL=http://ms-passengers:8001
      - MS_TRIPS_URL=http://ms-trips:8002
      - MS_TICKETS_URL=http://ms-tickets:8003
    depends_on:
      - ms-passengers
      - ms-trips
      - ms-tickets
    restart: unless-stopped

  # Microservicio ms-analytics (Python) - Analytics y reportes
  ms-analytics:
    build:
      context: ./backend/ms-analytics
      dockerfile: Dockerfile
    container_name: ms-analytics
    ports:
      - "8005:8005"
    environment:
      - ENVIRONMENT=development
      - MS_PASSENGERS_URL=http://ms-passengers:8001
      - MS_TRIPS_URL=http://ms-trips:8002
      - MS_TICKETS_URL=http://ms-tickets:8003
      - MS_HISTORY_URL=http://ms-history:8004
    depends_on:
      - ms-passengers
      - ms-trips
      - ms-tickets
      - ms-history
    restart: unless-stopped

volumes:
  mysql_trips_data:
  postgres_passengers_data:
  mongo_tickets_data:
