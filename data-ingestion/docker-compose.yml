# Docker Compose - Data Ingestion System
# ========================================
#
# Orquestación de los 3 contenedores de ingesta de datos de bases de datos
# ms-passengers-db, ms-trips-db, ms-tickets-db
# Basado en las especificaciones del README.md
#
# Uso:
# - Desarrollo: docker-compose up --build
# - Integración: docker-compose -f ../infra/docker-compose.yml -f docker-compose.yml up

version: '3.8'

# ========================================
# REDES
# ========================================
networks:
  # Red interna de ingesta
  bus-mvp-ingestion-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
  
  # Red externa para conectar con el sistema principal
  bus-mvp-network:
    external: true

# ========================================
# VOLÚMENES
# ========================================
volumes:
  # Volúmenes compartidos para datos
  ingestion_data:
    name: bus_mvp_ingestion_data
  ingestion_logs:
    name: bus_mvp_ingestion_logs
  ingestion_cache:
    name: bus_mvp_ingestion_cache
  
  # Volúmenes específicos por contenedor de base de datos
  passengers_temp:
    name: bus_mvp_passengers_temp
  trips_temp:
    name: bus_mvp_trips_temp
  tickets_temp:
    name: bus_mvp_tickets_temp

# ========================================
# SERVICIOS DE INGESTA DE BASES DE DATOS
# ========================================
services:

  # ========================================
  # CONTENEDOR 1: MS-Passengers Database Ingestion
  # ========================================
  ms-passengers-db:
    build:
      context: ./ms-passengers-db
      dockerfile: Dockerfile
    container_name: bus-mvp-passengers-ingestion
    hostname: passengers-ingestion
    environment:
      # Configuración básica
      - LOG_LEVEL=${INGESTION_LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - HEALTH_CHECK_PORT=8090
      
      # PostgreSQL Connection (matches infra/docker-compose.yml)
      - SQL1_HOST=${SQL1_HOST:-sql-db1}
      - SQL1_PORT=${SQL1_PORT:-5432}
      - SQL1_DB=${SQL1_DB:-passengers_db}
      - SQL1_USER=${SQL1_USER:-passengers_user}
      - SQL1_PASSWORD=${SQL1_PASSWORD:-change_me_sql1_password}
      
      # Network Configuration
      - DOCKER_NETWORK=bus-mvp-network
      - CONTAINER_NAME=bus-mvp-passengers-ingestion
      
      # Ingestion Settings
      - EXTRACTION_INTERVAL=${EXTRACTION_INTERVAL:-300}  # 5 minutos
      - BATCH_SIZE=${BATCH_SIZE:-1000}
      - CDC_ENABLED=${CDC_ENABLED:-true}
      - FULL_SYNC_HOUR=${FULL_SYNC_HOUR:-2}  # 2 AM daily full sync
      
      # Object Storage - AWS S3 Only
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-bus-mvp-data-lake}
      
      # Redis Cache
      - REDIS_HOST=bus-mvp-ingestion-redis
      - REDIS_PORT=6380
      - REDIS_PASSWORD=${REDIS_PASSWORD:-defaultpassword}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-defaultpassword}@redis-cache:6379
      
      # Data Catalog
      - CATALOG_API_URL=http://bus-mvp-ms-analytics:${MS_ANALYTICS_PORT:-8005}/catalog
      - CATALOG_API_KEY=${ANALYTICS_API_KEY:-analytics_api_key}
    ports:
      - "8090:8090"  # Health check port
    volumes:
      - ingestion_data:/app/data
      - ingestion_logs:/app/logs
      - passengers_temp:/app/temp
    networks:
      - bus-mvp-ingestion-network
      - bus-mvp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    depends_on:
      - redis-cache

  # ========================================
  # CONTENEDOR 2: MS-Trips Database Ingestion
  # ========================================
  ms-trips-db:
    build:
      context: ./ms-trips-db
      dockerfile: Dockerfile
    container_name: bus-mvp-trips-ingestion
    hostname: trips-ingestion
    environment:
      # Configuración básica
      - LOG_LEVEL=${INGESTION_LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - HEALTH_CHECK_PORT=8091
      
      # MySQL Connection (matches infra/docker-compose.yml)
      - SQL2_HOST=${SQL2_HOST:-sql-db2}
      - SQL2_PORT=${SQL2_PORT:-3306}
      - SQL2_DB=${SQL2_DB:-trips_db}
      - SQL2_USER=${SQL2_USER:-trips_user}
      - SQL2_PASSWORD=${SQL2_PASSWORD:-change_me_sql2_password}
      
      # Network Configuration
      - DOCKER_NETWORK=bus-mvp-network
      - CONTAINER_NAME=bus-mvp-trips-ingestion
      
      # Ingestion Settings
      - EXTRACTION_INTERVAL=${EXTRACTION_INTERVAL:-120}  # 2 minutos
      - BATCH_SIZE=${BATCH_SIZE:-500}
      - BINLOG_ENABLED=${BINLOG_ENABLED:-true}
      - ROUTES_SYNC_INTERVAL=${ROUTES_SYNC_INTERVAL:-3600}  # 1 hora
      
      # Object Storage - AWS S3 Only
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-bus-mvp-data-lake}
      
      # Redis Cache
      - REDIS_HOST=bus-mvp-ingestion-redis
      - REDIS_PORT=6380
      - REDIS_PASSWORD=${REDIS_PASSWORD:-defaultpassword}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-defaultpassword}@redis-cache:6379
      
      # Data Catalog
      - CATALOG_API_URL=http://bus-mvp-ms-analytics:${MS_ANALYTICS_PORT:-8005}/catalog
      - CATALOG_API_KEY=${ANALYTICS_API_KEY:-analytics_api_key}
    ports:
      - "8091:8091"  # Health check port
    volumes:
      - ingestion_data:/app/data
      - ingestion_logs:/app/logs
      - trips_temp:/app/temp
    networks:
      - bus-mvp-ingestion-network
      - bus-mvp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    depends_on:
      - redis-cache

  # ========================================
  # CONTENEDOR 3: MS-Tickets Database Ingestion
  # ========================================
  ms-tickets-db:
    build:
      context: ./ms-tickets-db
      dockerfile: Dockerfile
    container_name: bus-mvp-tickets-ingestion
    hostname: tickets-ingestion
    environment:
      # Configuración básica
      - LOG_LEVEL=${INGESTION_LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - HEALTH_CHECK_PORT=8092
      
      # MongoDB Connection (matches infra/docker-compose.yml)
      - NOSQL_HOST=${NOSQL_HOST:-nosql-db}
      - NOSQL_PORT=${NOSQL_PORT:-27017}
      - NOSQL_DB=${NOSQL_DB:-tickets_db}
      - NOSQL_USER=${NOSQL_USER:-tickets_user}
      - NOSQL_PASSWORD=${NOSQL_PASSWORD:-change_me_nosql_password}
      - MONGO_URL=mongodb://${NOSQL_USER:-tickets_user}:${NOSQL_PASSWORD:-change_me_nosql_password}@nosql-db:27017/${NOSQL_DB:-tickets_db}?authSource=admin
      
      # Network Configuration
      - DOCKER_NETWORK=bus-mvp-network
      - CONTAINER_NAME=bus-mvp-tickets-ingestion
      
      # Ingestion Settings
      - CHANGE_STREAMS=${CHANGE_STREAMS:-true}
      - BATCH_SIZE=${BATCH_SIZE:-2000}
      - FULL_SYNC_INTERVAL=${FULL_SYNC_INTERVAL:-86400}  # 24 horas
      
      # Object Storage - AWS S3 Only
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-bus-mvp-data-lake}
      
      # Redis Cache
      - REDIS_HOST=bus-mvp-ingestion-redis
      - REDIS_PORT=6380
      - REDIS_PASSWORD=${REDIS_PASSWORD:-defaultpassword}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-defaultpassword}@redis-cache:6379
      
      # Data Catalog
      - CATALOG_API_URL=http://bus-mvp-ms-analytics:${MS_ANALYTICS_PORT:-8005}/catalog
      - CATALOG_API_KEY=${ANALYTICS_API_KEY:-analytics_api_key}
    ports:
      - "8092:8092"  # Health check port
    volumes:
      - ingestion_data:/app/data
      - ingestion_logs:/app/logs
      - tickets_temp:/app/temp
    networks:
      - bus-mvp-ingestion-network
      - bus-mvp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - redis-cache

  # ========================================
  # SERVICIOS AUXILIARES (opcional)
  # ========================================

  # Redis para cache y buffering
  redis-cache:
    image: redis:7-alpine
    container_name: bus-mvp-ingestion-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-defaultpassword}
    ports:
      - "6380:6379"  # Puerto diferente para evitar conflictos
    volumes:
      - ingestion_cache:/data
    networks:
      - bus-mvp-ingestion-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Prometheus para métricas (opcional)
  prometheus:
    image: prom/prometheus:latest
    container_name: bus-mvp-ingestion-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - bus-mvp-ingestion-network
    restart: unless-stopped
    profiles:
      - monitoring

# ========================================
# COMANDOS ÚTILES DE DESARROLLO
# ========================================

# Para usar este compose en desarrollo:
# 1. Copiar .env.example a .env y configurar variables
# 2. docker-compose up --build
#
# Para usar solo algunos servicios:
# docker-compose up ms-passengers-db redis-cache minio
#
# Para incluir monitoreo:
# docker-compose --profile monitoring up
#
# Para testing de conectividad:
# docker-compose exec ms-passengers-db python scripts/health_check.py
# docker-compose exec ms-trips-db python scripts/health_check.py  
# docker-compose exec ms-tickets-db python scripts/health_check.py
#
# Para ver logs:
# docker-compose logs -f ms-passengers-db
# docker-compose logs -f --tail=100

# ========================================
# INTEGRACIÓN CON SISTEMA COMPLETO
# ========================================

# Este archivo puede ser incluido en el docker-compose principal:
# 
# Desde infra/:
# docker-compose -f docker-compose.yml -f ../data-ingestion/docker-compose.yml up --build
#
# O extender servicios específicos:
# services:
#   ms-passengers-db:
#     extends:
#       file: ../data-ingestion/docker-compose.yml
#       service: ms-passengers-db
#     networks:
#       - bus-mvp-network

# ========================================
# CONFIGURACIÓN DE RED PARA INTEGRACIÓN  
# ========================================

# Para conectar manualmente a la red principal:
# docker network connect bus-mvp-network bus-mvp-passengers-ingestion
# docker network connect bus-mvp-network bus-mvp-trips-ingestion  
# docker network connect bus-mvp-network bus-mvp-tickets-ingestion

# ========================================
# VARIABLES DE ENTORNO REQUERIDAS
# ========================================

# PostgreSQL (ms-passengers):
# SQL1_HOST, SQL1_PORT, SQL1_DB, SQL1_USER, SQL1_PASSWORD
#
# MySQL (ms-trips):  
# SQL2_HOST, SQL2_PORT, SQL2_DB, SQL2_USER, SQL2_PASSWORD
#
# MongoDB (ms-tickets):
# NOSQL_HOST, NOSQL_PORT, NOSQL_DB, NOSQL_USER, NOSQL_PASSWORD
#
# Object Storage:
# STORAGE_TYPE, OBJECT_STORE_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#
# Opcional:
# REDIS_PASSWORD, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD
